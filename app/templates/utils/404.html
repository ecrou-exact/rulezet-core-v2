{% extends 'base.html' %}
{% block page_title %}404 — Page not found{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/utils/error.css') }}">
{% endblock %}

{% block content %}
<error-page
    code="404"
    title="Page not found"
    description="The page you're looking for doesn't exist or has been moved.">
</error-page>
{% endblock %}

{% block script %}
<script type="module">
    const { createApp } = Vue
    import { message_list } from '/static/js/toaster.js'
    import ErrorPage from '/static/js/components/error-page.js'
    createApp({
        delimiters: ['[[', ']]'],
        components: { ErrorPage },
        setup() { return { message_list } },
    }).mount('#main-container')
</script>
{% endblock %}
